<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Picture Day — change password</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<div class="shell" style="max-width:640px;margin:auto">
  <main style="width:100%">
    <div class="head">
      <div>
        <h1>Change your password</h1>
        <p>Your administrator gave you a temporary password. You must choose a new password before you can use Picture Day.</p>
      </div>
    </div>

    <div class="card">
      <h2>Set your password</h2>

      <label for="current">Temporary password</label>
      <input id="current" type="password" autocomplete="current-password">

      <label for="next">New password</label>
      <input id="next" type="password" minlength="10" autocomplete="new-password">
      <p class="hint">Use at least 10 characters.</p>

      <label for="confirm">Confirm new password</label>
      <input id="confirm" type="password" minlength="10" autocomplete="new-password">

      <button class="primary" id="save" style="margin-top:16px">Set new password</button>
      <p id="message" class="hint" hidden></p>
    </div>

    <div style="margin-top:16px">
      <button class="ghost" id="signout">Sign out</button>
    </div>
  </main>
</div>

<script type="module">
import { api, setCsrf } from '/assets/common.js';

const current = document.querySelector('#current');
const next = document.querySelector('#next');
const confirm = document.querySelector('#confirm');
const save = document.querySelector('#save');
const message = document.querySelector('#message');
const signout = document.querySelector('#signout');

function showMessage(text, bad = false) {
  message.textContent = text;
  message.hidden = false;
  message.style.color = bad ? 'var(--accent)' : '';
}

signout.addEventListener('click', async () => {
  try { await api('/api/logout', { method: 'POST' }); } catch {}
  location.href = '/login';
});

save.addEventListener('click', async () => {
  message.hidden = true;

  if (!current.value) return showMessage('Enter your temporary password.', true);
  if (next.value.length < 10) return showMessage('New password must be at least 10 characters.', true);
  if (next.value !== confirm.value) return showMessage('The new passwords do not match.', true);

  save.disabled = true;

  try {
    const res = await api('/api/password', {
      method: 'POST',
      body: { current: current.value, next: next.value }
    });

    if (res.csrf) setCsrf(res.csrf);
    showMessage('Password changed. Taking you to the staff area…');
    setTimeout(() => { location.href = '/admin'; }, 500);
  } catch (e) {
    showMessage(e.message, true);
    save.disabled = false;
  }
});
</script>
</body>
</html>
