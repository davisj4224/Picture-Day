<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — Picture Day</title>
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<div class="auth">
  <form class="card" id="form">
    <div class="mark"><span class="lens"></span><b>Picture Day</b></div>
    <h1>Sign in</h1>
    <p class="hint">Staff accounts open the roster and photographs. The <b>design</b> account opens the design studio only.</p>

    <div class="field">
      <label for="username">Username</label>
      <input id="username" name="username" type="text" required autocomplete="username" autofocus>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <div class="password-wrap">
        <input id="password" name="password" type="password" required autocomplete="current-password">
        <label class="toggle" for="showPassword">
          <input id="showPassword" type="checkbox">
          <span>Show</span>
        </label>
      </div>
    </div>

    <div class="row toggle-row">
      <button type="button" class="btn ghost small" id="toggleReset">Reset password</button>
    </div>

    <div class="card nested" id="resetPanel" hidden>
      <h2>Reset a password</h2>
      <p class="hint">Use this to set a new password for a staff or design account.</p>
      <div class="field">
        <label for="resetUsername">Username</label>
        <input id="resetUsername" type="text" autocomplete="username">
      </div>
      <div class="field">
        <label for="resetPassword">New password</label>
        <input id="resetPassword" type="password" minlength="10" autocomplete="new-password">
      </div>
      <div class="row reset-actions">
        <button type="button" class="primary" id="resetSubmit">Set new password</button>
        <button type="button" class="btn ghost small" id="cancelReset">Cancel</button>
      </div>
      <div id="resetNotice" class="notice good" hidden></div>
      <div id="resetErr" class="notice bad" hidden></div>
    </div>

    <div id="err" class="notice bad" hidden></div>
    <div class="row">
      <button class="primary" type="submit">Sign in</button>
      <a class="btn ghost small" href="/">Back to the school page</a>
    </div>
  </form>
</div>

<script type="module">
import { api, setCsrf } from '/assets/common.js';
const form = document.getElementById('form');
const err = document.getElementById('err');
const password = document.getElementById('password');
const showPassword = document.getElementById('showPassword');
const toggleReset = document.getElementById('toggleReset');
const resetPanel = document.getElementById('resetPanel');
const resetUsername = document.getElementById('resetUsername');
const resetPassword = document.getElementById('resetPassword');
const resetErr = document.getElementById('resetErr');
const resetNotice = document.getElementById('resetNotice');
const cancelReset = document.getElementById('cancelReset');
const resetSubmit = document.getElementById('resetSubmit');

showPassword.addEventListener('change', () => {
  password.type = showPassword.checked ? 'text' : 'password';
});

toggleReset.addEventListener('click', () => {
  resetPanel.hidden = !resetPanel.hidden;
  resetErr.hidden = true;
  resetNotice.hidden = true;
  if (!resetPanel.hidden) resetUsername.focus();
});

cancelReset.addEventListener('click', () => {
  resetPanel.hidden = true;
  resetUsername.value = '';
  resetPassword.value = '';
  resetErr.hidden = true;
  resetNotice.hidden = true;
});

resetSubmit.addEventListener('click', async () => {
  resetErr.hidden = true;
  resetNotice.hidden = true;
  const username = resetUsername.value.trim().toLowerCase();
  const nextPassword = resetPassword.value;
  if (!username || nextPassword.length < 10) {
    resetErr.textContent = 'Enter a username and a new password with at least 10 characters.';
    resetErr.hidden = false;
    return;
  }
  try {
    await api('/api/reset-password', { method: 'POST', body: { username, password: nextPassword } });
    resetNotice.textContent = 'Password updated. You can sign in with the new password.';
    resetNotice.hidden = false;
    resetUsername.value = '';
    resetPassword.value = '';
    form.username.value = username;
    form.password.value = '';
    form.password.focus();
  } catch (e2) {
    resetErr.textContent = e2.message;
    resetErr.hidden = false;
  }
});

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  err.hidden = true;
  try {
    const res = await api('/api/login', { method: 'POST', body: { username: form.username.value, password: form.password.value }});
    setCsrf(res.csrf);
    location.href = res.user.role === 'staff' ? '/admin' : '/design';
  } catch (e2) {
    err.textContent = e2.message;
    err.hidden = false;
  }
});
</script>
</body>
</html>
